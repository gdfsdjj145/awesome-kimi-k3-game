<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1017;color:#e8ecf3;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;padding:32px 20px}
header{max-width:1100px;margin:0 auto 24px}
h1{font-size:28px}header p{opacity:.75;margin-top:8px;line-height:1.7;font-size:14px}
a{color:#8ab4ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:#161b26;border:1px solid #252c3b;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:5/3;object-fit:cover;display:block;background:#000;transition:transform .3s}
.card a.thumb{overflow:hidden;display:block}.card a.thumb:hover img{transform:scale(1.04)}
.body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:#3a2f12;color:#ffd36a;border:1px solid #6b5520;font-weight:normal}
.desc{font-size:13px;opacity:.75;line-height:1.6}
.meta{font-size:12px;opacity:.55}
.btns{display:flex;gap:8px;margin-top:auto}
.btns a,.btns button{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid #33405a;background:#1f2738;color:#e8ecf3;text-decoration:none}
.btns a.play{background:#2d5bff;border-color:#2d5bff}
.btns button.ok{background:#1d6b3a;border-color:#1d6b3a}
main,nav{max-width:1100px;margin:0 auto}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;position:sticky;top:0;background:#0d1017ee;padding:10px 0;z-index:5}
nav a{padding:6px 14px;border-radius:999px;background:#1f2738;border:1px solid #33405a;text-decoration:none;color:#e8ecf3;font-size:14px}
nav a small{margin-left:6px;opacity:.6}
section{margin:22px 0 10px}section h2{font-size:20px;margin-bottom:12px;padding-left:10px;border-left:4px solid #ffd36a}
footer{max-width:1100px;margin:28px auto 0;font-size:12px;opacity:.5;line-height:1.7}
</style>
</head>
<body>
<header>

const main=document.getElementById("main"),nav=document.getElementById("nav");
for(const cat of CATS){const items=EFFECTS.filter(e=>e.cat==cat);if(!items.length)continue;
 const id="cat-"+CATS.indexOf(cat);nav.innerHTML+=`<a href="#${id}">${cat}<small>${items.length}</small></a>`;
 const sec=document.createElement("section");sec.id=id;sec.innerHTML=`<h2>${cat}</h2>`;const g=document.createElement("div");g.className="grid";sec.appendChild(g);main.appendChild(sec);
 for(const e of items){const url=`effects/${e.slug}/`;
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<a class="thumb" href="${url}"><img src="${url}preview.png" alt="${e.name}" loading="lazy"></a>
  <div class="body"><div class="title">${e.name}<span class="tag">参考实现</span></div>
  <div class="desc">${e.desc}</div><div class="meta">引擎：${e.engine} · 作者：Grok Bot（非 Kimi 生成）</div>
  <div class="btns"><a class="play" href="${url}">▶ 开始玩</a><a href="${url}prompt.md" target="_blank">查看提示词</a><button>📋 复制提示词</button></div></div>`;
  const b=d.querySelector("button");
  b.onclick=async()=>{try{const t=await (await fetch(`${url}prompt.md`)).text();
    try{await navigator.clipboard.writeText(t)}catch{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
    b.textContent="✅ 已复制";b.classList.add("ok")}catch(err){b.textContent="❌ 复制失败"}
    setTimeout(()=>{b.textContent="📋 复制提示词";b.classList.remove("ok")},1800)};
  g.appendChild(d)}}
