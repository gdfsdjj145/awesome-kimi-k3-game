<title>能量护盾受击涟漪 · 参考实现</title>
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}canvas{display:block}

</style>
<style>#hp{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(70vw,360px);height:10px;border-radius:6px;background:#ffffff22;overflow:hidden;z-index:10}#hp i{display:block;height:100%;background:linear-gradient(90deg,#3cf,#9ff);transition:width .2s}</style></head><body>
<div class="hud"><b>🛡️ 能量护盾</b><div class="tip">点击 / 轻触护盾发动攻击 · 拖动旋转视角 · 六边形涟漪由着色器计算</div>
<div class="btns"><button id="rain" class="on">炮火齐射</button><button id="laser">激光扫射</button><button data-c="0" class="on">青</button><button data-c="1">金</button><button data-c="2">紫</button></div></div>
<div id="hp"><i></i></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
const P=new URLSearchParams(location.search),DEMO=P.has("demo"),FT=P.has("t")?+P.get("t"):null;
const Q=(()=>{const coarse=matchMedia("(pointer:coarse)").matches,small=Math.min(innerWidth,innerHeight)<700,weak=(navigator.hardwareConcurrency||8)<=4,low=coarse||small||weak;return{low,pr:Math.min(devicePixelRatio||1,2),n:low?.5:1}})();
const fpsEl=document.createElement("div");fpsEl.id="fps";document.body.appendChild(fpsEl);
window.__fps=0;let __fc=0,__ft=performance.now(),__lc=0;
function perfTick(onLow){__fc++;const n=performance.now();if(n-__ft>=1000){window.__fps=Math.round(__fc*1000/(n-__ft));__fc=0;__ft=n;fpsEl.textContent=window.__fps+" FPS"+(Q.low?" · 省电档":"");if(window.__fps<40&&onLow&&++__lc>=2){__lc=0;onLow()}}}
import * as THREE from "three";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {ShaderPass} from "three/addons/postprocessing/ShaderPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";
const R=new THREE.WebGLRenderer({antialias:!Q.low,powerPreference:"high-performance"});
R.setPixelRatio(Q.pr);R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const composer=new EffectComposer(R);composer.setPixelRatio(Q.pr);
function lowerPR(){if(Q.pr<=.6)return;Q.pr=Math.max(.6,Q.pr*.8);R.setPixelRatio(Q.pr);composer.setPixelRatio(Q.pr);composer.setSize(innerWidth,innerHeight)}
function onResize(cam){addEventListener("resize",()=>{if(cam.isPerspectiveCamera){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}R.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)})}
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
R.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02040a);scene.fog=new THREE.Fog(0x02040a,20,60);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);cam.position.set(0,2.5,innerWidth<innerHeight?15:10.5);onResize(cam);
const ctl=new OrbitControls(cam,R.domElement);ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=6;ctl.maxDistance=22;ctl.autoRotate=true;ctl.autoRotateSpeed=.6;
scene.add(new THREE.HemisphereLight(0x88aaff,0x101020,.6));const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(3,6,4);scene.add(dl);
// 被保护的核心：机甲水晶
const core=new THREE.Group();scene.add(core);
core.add(new THREE.Mesh(new THREE.IcosahedronGeometry(.9,1),new THREE.MeshStandardMaterial({color:0x223,metalness:.8,roughness:.25,flatShading:true})));
const coreGlow=new THREE.Mesh(new THREE.IcosahedronGeometry(.5,0),new THREE.MeshBasicMaterial({color:0x66ddff}));core.add(coreGlow);
for(let i=0;i<6;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.18,1.4,.18),new THREE.MeshStandardMaterial({color:0x334,metalness:.9,roughness:.3}));const a=i/6*Math.PI*2;p.position.set(Math.cos(a)*1.5,-.4,Math.sin(a)*1.5);p.rotation.z=Math.cos(a)*.3;p.rotation.x=-Math.sin(a)*.3;core.add(p)}
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,64),new THREE.MeshStandardMaterial({color:0x0a0f1c,metalness:.6,roughness:.5}));ground.rotation.x=-Math.PI/2;ground.position.y=-3.2;scene.add(ground);
// 护盾着色器
const MAXH=12,hits=[];for(let i=0;i<MAXH;i++)hits.push(new THREE.Vector4(0,1,0,99));
const SU={uT:{value:0},uH:{value:hits},uCol:{value:new THREE.Color(0x33ccff)},uHp:{value:1},uBreak:{value:0}};
const shieldMat=new THREE.ShaderMaterial({uniforms:SU,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
vertexShader:`uniform vec4 uH[${MAXH}];uniform float uT;varying vec3 vN,vP,vV;varying vec2 vUv;
void main(){vec3 n=normalize(position);float d=0.;for(int i=0;i<${MAXH};i++){float a=uH[i].w;if(a<2.){float ang=acos(clamp(dot(n,uH[i].xyz),-1.,1.));d+=sin((ang-a*2.2)*14.)*exp(-pow((ang-a*2.2)*3.,2.))*(1.-a/2.)*.12;}}
vec3 p=position+n*d;vUv=uv;vN=normalize(normalMatrix*n);vec4 w=modelMatrix*vec4(p,1.);vP=n;vV=normalize(cameraPosition-w.xyz);gl_Position=projectionMatrix*viewMatrix*w;}`,
fragmentShader:`uniform vec4 uH[${MAXH}];uniform float uT,uHp,uBreak;uniform vec3 uCol;varying vec3 vN,vP,vV;varying vec2 vUv;
vec4 hexd(vec2 p){vec2 r=vec2(1.,1.732),h=r*.5;vec2 a=mod(p,r)-h,b=mod(p-h,r)-h;vec2 g=dot(a,a)<dot(b,b)?a:b;vec2 id=p-g;g=abs(g);float e=.5-max(dot(g,r*.5),g.x);return vec4(g,e,fract(sin(dot(id,vec2(12.9,78.2)))*43758.5));}
void main(){float fr=pow(1.-abs(dot(normalize(vN),normalize(vV))),2.5);
 vec2 hp=vec2(atan(vP.z,vP.x)*3.2,vP.y*3.6)*2.2;vec4 hx=hexd(hp);float edge=smoothstep(.06,.0,hx.z);
 float ripple=0.,flash=0.;for(int i=0;i<${MAXH};i++){float a=uH[i].w;if(a<2.){float ang=acos(clamp(dot(vP,uH[i].xyz),-1.,1.));
  ripple+=exp(-pow((ang-a*2.2)*7.,2.))*(1.-a/2.)*1.6;flash+=exp(-ang*ang*30.)*exp(-a*6.)*3.;}}
 float scan=pow(.5+.5*sin(vP.y*20.-uT*3.),8.)*.25;float flick=.85+.15*sin(uT*30.+hx.w*50.);
 float hexLit=edge*(.18+fr*.8+ripple*1.4)+ (hx.w>.93?.12*(.5+.5*sin(uT*4.+hx.w*30.)):0.)+ripple*(1.-edge)*.25*step(.6,hx.w+ripple*.3);
 vec3 c=uCol*(fr*.9+hexLit+scan)*flick+vec3(1.)*flash+mix(uCol,vec3(1.),.5)*ripple*.35;
 float lowHp=1.-uHp;c=mix(c,c*vec3(1.6,.4,.3),lowHp*.6*(.5+.5*sin(uT*10.)));
 float brk=uBreak>0.?step(hx.w,uBreak):0.;c*=1.-brk;
 gl_FragColor=vec4(c*.45,clamp(fr*.8+hexLit+ripple+flash,0.,1.));}`});
const shield=new THREE.Mesh(new THREE.SphereGeometry(3,Q.low?64:96,Q.low?48:72),shieldMat);scene.add(shield);
// 炮弹、火花
const N=Math.round(1600*Q.n),spark=new Float32Array(N*3),sv=[],sl=new Float32Array(N);for(let i=0;i<N;i++){spark[i*3+1]=-99;sv.push(new THREE.Vector3())}
const sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.BufferAttribute(spark,3));sg.setAttribute("aL",new THREE.BufferAttribute(sl,1));
const sMat=new THREE.ShaderMaterial({uniforms:{uC:SU.uCol,uPx:{value:Q.pr}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 vertexShader:"attribute float aL;varying float vL;uniform float uPx;void main(){vL=aL;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=uPx*40.*aL/-mv.z;gl_Position=projectionMatrix*mv;}",
 fragmentShader:"varying float vL;uniform vec3 uC;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(mix(uC,vec3(1.),.6),vL*smoothstep(.5,0.,d));}"});
scene.add(new THREE.Points(sg,sMat));let si=0;
const bullets=[];const bGeo=new THREE.SphereGeometry(.12,8,6);
function fire(from,to,col){const m=new THREE.Mesh(bGeo,new THREE.MeshBasicMaterial({color:col||0xff7a3a}));m.position.copy(from);m.scale.set(1,1,3);m.lookAt(to);scene.add(m);bullets.push({m,v:to.clone().sub(from).normalize().multiplyScalar(22)})}
let hp=1,hi=0,brk=0;const hpEl=document.querySelector("#hp i");
function hit(p,power=1){const n=p.clone().normalize();hits[hi%MAXH].set(n.x,n.y,n.z,0);hi++;hp=Math.max(0,hp-.03*power);
 for(let k=0;k<Math.round(30*Q.n*power);k++){const i=si++%N;const q=n.clone().multiplyScalar(3.02);spark.set([q.x,q.y,q.z],i*3);sv[i].copy(n).multiplyScalar(2+Math.random()*5).add(new THREE.Vector3().randomDirection().multiplyScalar(3));sl[i]=1}
 if(hp<=0&&!brk)brk=.001}
// 交互：点击护盾 = 从镜头方向射击
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();let downAt=null;
R.domElement.addEventListener("pointerdown",e=>downAt=[e.clientX,e.clientY]);
R.domElement.addEventListener("pointerup",e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>8)return;pt.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pt,cam);const h=ray.intersectObject(shield)[0];if(h)fire(cam.position.clone().add(new THREE.Vector3(0,-.6,0)),h.point,0xffee66)});
let rainOn=true,laser=false;const rb=document.getElementById("rain"),lb=document.getElementById("laser");
rb.onclick=()=>{rainOn=!rainOn;rb.classList.toggle("on",rainOn)};lb.onclick=()=>{laser=!laser;lb.classList.toggle("on",laser)};
const COLS=[0x33ccff,0xffc040,0xb060ff];document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{SU.uCol.value.setHex(COLS[+b.dataset.c]);coreGlow.material.color.setHex(COLS[+b.dataset.c]);document.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("on",x==b))});
const beam=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1,8,1,true),new THREE.MeshBasicMaterial({color:0xff4060,transparent:true,blending:THREE.AdditiveBlending}));beam.visible=false;scene.add(beam);
composer.addPass(new RenderPass(scene,cam));composer.addPass(new UnrealBloomPass(new THREE.Vector2(256,256),.7,.4,.45));composer.addPass(new OutputPass());
const clk=new THREE.Clock();let t=0,nextShot=0,lasT=0;const tmp=new THREE.Vector3();
if(FT!==null){for(let k=0;k<5;k++){const d=new THREE.Vector3().randomDirection();d.y=Math.abs(d.y)*.5;hit(d.normalize().multiplyScalar(3),1);hits[k].w=.1+k*.18}}
(function f(){requestAnimationFrame(f);perfTick(lowerPR);const dt=Math.min(.05,clk.getDelta());t+=dt;SU.uT.value=t;
 for(const h of hits)if(h.w<99)h.w+=FT!==null?0:dt;
 if(rainOn&&t>nextShot&&FT===null){nextShot=t+.12+Math.random()*.35;const a=Math.random()*6.28,e=Math.random()*1.2;const from=new THREE.Vector3(Math.cos(a)*18,1+e*8,Math.sin(a)*18);fire(from,new THREE.Vector3().randomDirection().multiplyScalar(.5))}
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.m.position.addScaledVector(b.v,dt);if(b.m.position.length()<3.05&&!brk){hit(b.m.position.clone(),1);scene.remove(b.m);bullets.splice(i,1)}else if(b.m.position.length()>40||b.m.position.length()<1){scene.remove(b.m);bullets.splice(i,1)}}
 beam.visible=laser&&!brk;if(laser&&!brk){lasT+=dt;const from=new THREE.Vector3(10,6,-6),to=new THREE.Vector3(Math.cos(lasT*1.5),Math.sin(lasT*2.3)*.6+.3,Math.sin(lasT*1.5)).normalize().multiplyScalar(3);
  beam.position.copy(from).add(to).multiplyScalar(.5);beam.scale.y=from.distanceTo(to);beam.lookAt(to);beam.rotateX(Math.PI/2);if(Math.random()<.5)hit(to,.4)}
 for(let i=0;i<N;i++)if(sl[i]>0){spark[i*3]+=sv[i].x*dt;spark[i*3+1]+=sv[i].y*dt;spark[i*3+2]+=sv[i].z*dt;sv[i].y-=6*dt;sl[i]=Math.max(0,sl[i]-dt*1.6)}
 sg.attributes.position.needsUpdate=sg.attributes.aL.needsUpdate=true;
 if(brk){brk+=dt*.8;SU.uBreak.value=brk;if(brk>2.2){brk=0;SU.uBreak.value=0;hp=1}}else hp=Math.min(1,hp+dt*.04);
 SU.uHp.value=hp;hpEl.style.width=(hp*100)+"%";coreGlow.rotation.y+=dt*2;coreGlow.scale.setScalar(1+Math.sin(t*4)*.08);
 ctl.update();composer.render()})();
</script></body></html>
