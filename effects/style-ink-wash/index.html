<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>水墨风格 · 参考实现</title>
<style>*{margin:0}body{background:#efe6d2;overflow:hidden;font-family:"STKaiti","KaiTi","Kaiti SC",serif}canvas{display:block}
#tip{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#3a332a;opacity:.7;font-size:15px;letter-spacing:2px}</style></head>
<body><canvas id="c"></canvas><div id="tip">移动鼠标引导扁舟 · 点击水面落墨 · 按 空格 切换 晨 / 暮</div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let W,H,paper,mount;const R=(a,b)=>a+Math.random()*(b-a);
let seed=3;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
function noise1(t,s){return Math.sin(t*1.3+s)*.5+Math.sin(t*2.7+s*2)*.25+Math.sin(t*5.9+s*3)*.12+Math.sin(t*11.3+s)*.06}
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;buildPaper();buildMount()}
function buildPaper(){paper=document.createElement("canvas");paper.width=W;paper.height=H;const p=paper.getContext("2d");p.fillStyle="#efe6d2";p.fillRect(0,0,W,H);
 for(let i=0;i<W*H/60;i++){p.fillStyle=`rgba(${120+R(0,60)},${100+R(0,50)},${70},${R(.02,.07)})`;p.fillRect(R(0,W),R(0,H),R(.5,2),R(.5,2))}
 for(let i=0;i<60;i++){p.strokeStyle=`rgba(150,130,100,${R(.02,.05)})`;p.lineWidth=R(.3,1);p.beginPath();const y=R(0,H);p.moveTo(R(0,W),y);p.bezierCurveTo(R(0,W),y+R(-20,20),R(0,W),y+R(-20,20),R(0,W),y+R(-30,30));p.stroke()}
 const g=p.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(90,70,40,.18)");p.fillStyle=g;p.fillRect(0,0,W,H)}
// 山：多层，每层用模糊+渐隐的墨色绘制，远淡近浓
function buildMount(){mount=document.createElement("canvas");mount.width=W;mount.height=H;const m=mount.getContext("2d");seed=3;
 const layers=[[.30,.16,"rgba(70,75,80,",.22,18],[.42,.2,"rgba(50,55,58,",.35,10],[.55,.18,"rgba(30,32,35,",.55,5],[.62,.12,"rgba(15,15,18,",.8,2]];
 layers.forEach(([base,amp,col,al,blur],li)=>{const s=rnd()*100;m.filter=`blur(${blur}px)`;
  for(let k=0;k<3;k++){m.beginPath();m.moveTo(0,H);for(let xx=0;xx<=W;xx+=4){const t=xx/W*4+li;const peak=Math.pow(Math.max(0,noise1(t,s)+.4),1.6);m.lineTo(xx,H*base-peak*H*amp*1.3+k*6)}m.lineTo(W,H);m.closePath();
   const g=m.createLinearGradient(0,H*(base-amp*1.2),0,H*(base+.15));g.addColorStop(0,col+al*(1-k*.25)+")");g.addColorStop(.5,col+al*.5+")");g.addColorStop(1,col+"0)");m.fillStyle=g;m.fill()}
  // 皴法：在山脊附近画短笔触
  m.filter="none";for(let i=0;i<W/6;i++){const xx=rnd()*W,t=xx/W*4+li,ry=H*base-Math.pow(Math.max(0,noise1(t,s)+.4),1.6)*H*amp*1.3;m.strokeStyle=col+(al*.5)+")";m.lineWidth=rnd()*1.5+.3;m.beginPath();m.moveTo(xx,ry+rnd()*30);m.lineTo(xx+rnd()*8-4,ry+rnd()*60+10);m.stroke()}
  if(li==3){for(let i=0;i<9;i++){const tx=W*(.05+rnd()*.25);pine(m,tx,H*base-Math.pow(Math.max(0,noise1(tx/W*4+li,s)+.4),1.6)*H*amp*1.3+5,20+rnd()*25)}}});
 m.filter="none"}
function pine(m,X,Y,h){m.strokeStyle="rgba(15,15,18,.85)";m.lineWidth=1.5;m.beginPath();m.moveTo(X,Y);m.lineTo(X+R(-3,3),Y-h);m.stroke();for(let i=0;i<5;i++){const yy=Y-h*(.3+i*.15),w=h*(.5-i*.08);m.fillStyle=`rgba(15,15,18,${.5+i*.08})`;m.beginPath();m.ellipse(X,yy,w,w*.22,R(-.1,.1),0,7);m.fill()}}
rs();addEventListener("resize",rs);
let boat={x:W*.6,y:H*.78,tx:W*.6,ty:H*.78},drops=[],birds=Array.from({length:5},(_,i)=>({x:W*.3+i*30,y:H*.2+i%2*14,ph:i})),dusk=false,t=0,trail=[];
addEventListener("pointermove",e=>{boat.tx=e.clientX;boat.ty=Math.max(H*.7,Math.min(H*.93,e.clientY))});
addEventListener("pointerdown",e=>{drops.push({x:e.clientX,y:e.clientY,r:2,l:1,blobs:Array.from({length:8},()=>[R(0,7),R(.6,1.3)])})});
addEventListener("keydown",e=>{if(e.code=="Space"){e.preventDefault();dusk=!dusk}});
function loop(){t++;x.drawImage(paper,0,0);
 // 日/月：朱红或淡墨圆
 x.fillStyle=dusk?"rgba(190,40,30,.85)":"rgba(200,60,40,.55)";x.filter="blur(1.5px)";x.beginPath();x.arc(W*.78,H*.2,dusk?38:30,0,7);x.fill();x.filter="none";
 if(dusk){x.fillStyle="rgba(120,90,60,.12)";x.fillRect(0,0,W,H)}
 x.drawImage(mount,0,0);
 // 水面：淡墨横向笔触
 for(let i=0;i<26;i++){const y=H*.68+i*(H*.32/26),off=Math.sin(t*.01+i)*30;x.strokeStyle=`rgba(40,40,45,${.04+i*.003})`;x.lineWidth=1;x.beginPath();x.moveTo(W*.1+off+(i*97)%200,y);x.lineTo(W*.6+off+(i*53)%300,y+Math.sin(i)*2);x.stroke()}
 // 倒影
 x.save();x.globalAlpha=.12;x.translate(0,H*1.36);x.scale(1,-1);x.filter="blur(4px)";x.drawImage(mount,0,0,W,H*.68,0,H*.0,W,H*.68);x.restore();x.filter="none";
 // 墨滴晕染
 for(const d of drops){d.r+=(60-d.r)*.03;d.l-=.004;x.fillStyle=`rgba(20,20,25,${d.l*.25})`;x.filter="blur(3px)";x.beginPath();d.blobs.forEach(([a,s],k)=>{const rr=d.r*s;x.moveTo(d.x+Math.cos(a)*rr+rr*.4,d.y+Math.sin(a)*rr*.5);x.arc(d.x+Math.cos(a)*rr,d.y+Math.sin(a)*rr*.5,rr*.4,0,7)});x.fill();x.filter="none"}
 drops=drops.filter(d=>d.l>0);
 // 扁舟
 boat.x+=(boat.tx-boat.x)*.01;boat.y+=(boat.ty-boat.y)*.01;trail.push([boat.x,boat.y]);if(trail.length>120)trail.shift();
 trail.forEach(([a,b],i)=>{x.strokeStyle=`rgba(30,30,35,${i/120*.15})`;x.lineWidth=1;x.beginPath();x.moveTo(a-30-i*.2,b+4);x.lineTo(a-10,b+4);x.stroke()});
 const bob=Math.sin(t*.04)*2;x.save();x.translate(boat.x,boat.y+bob);x.fillStyle="rgba(15,15,18,.9)";x.beginPath();x.moveTo(-34,-2);x.quadraticCurveTo(0,10,34,-4);x.quadraticCurveTo(0,4,-34,-2);x.fill();
 x.fillRect(-6,-14,14,10);x.beginPath();x.moveTo(-10,-14);x.quadraticCurveTo(1,-24,12,-14);x.fill();x.strokeStyle="rgba(15,15,18,.9)";x.lineWidth=1.2;x.beginPath();x.moveTo(18,-6);x.lineTo(38,-30);x.stroke();
 x.beginPath();x.arc(20,-12,4,0,7);x.fill();x.restore();
 // 飞鸟
 for(const b of birds){b.x+=.35;if(b.x>W+40)b.x=-40;const f=Math.sin(t*.12+b.ph)*5;x.strokeStyle="rgba(20,20,25,.8)";x.lineWidth=1.6;x.beginPath();x.moveTo(b.x-8,b.y-f);x.quadraticCurveTo(b.x-3,b.y-2,b.x,b.y);x.quadraticCurveTo(b.x+3,b.y-2,b.x+8,b.y-f);x.stroke()}
 // 竖排题字 + 印章
 x.fillStyle="rgba(25,22,20,.88)";x.font=`${Math.min(30,H*.04)}px "STKaiti","KaiTi","Kaiti SC",serif`;x.textAlign="center";const poem=["孤舟蓑笠翁","独钓寒江雪"];poem.forEach((l,k)=>[...l].forEach((ch,i)=>x.fillText(ch,W*.93-k*38,H*.12+i*36)));
 x.fillStyle="#b8231a";x.fillRect(W*.93-58,H*.12+5*36,36,36);x.fillStyle="#efe6d2";x.font="14px serif";x.fillText("墨",W*.93-49,H*.12+5*36+16);x.fillText("意",W*.93-31,H*.12+5*36+30);
 requestAnimationFrame(loop)}
loop();if(new URLSearchParams(location.search).get("demo")){drops.push({x:W*.4,y:H*.85,r:30,l:.9,blobs:Array.from({length:8},()=>[R(0,7),R(.6,1.3)])})}
</script></body></html>
