<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>火焰与烟雾流体 · 参考实现</title>
<style>*{margin:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}canvas{display:block}
#fps{position:fixed;right:8px;bottom:8px;font:11px monospace;color:#8f8;background:#0008;padding:2px 6px;border-radius:4px;z-index:99;pointer-events:none}
.hud{position:fixed;top:10px;left:10px;right:10px;z-index:10;font-size:13px;line-height:1.6;pointer-events:none;text-shadow:0 1px 3px #000}
.hud b{font-size:15px}.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.hud button,.btn{pointer-events:auto;background:#ffffff1c;color:#fff;border:1px solid #ffffff45;border-radius:999px;padding:6px 12px;font-size:13px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);cursor:pointer;font-family:inherit}
.hud button.on{background:#ffffffd8;color:#000}.tip{opacity:.75;font-size:12px}
</style>
</head><body>
<div class="hud"><b>🔥 火焰与烟雾</b><div class="tip">轻触添加火源（最多 6 个）· 拖动火源移动 · 双击清空 · 域扭曲噪声模拟湍流</div>
<div class="btns"><button data-p="0" class="on">篝火</button><button data-p="1">蓝焰</button><button data-p="2">妖火</button><button data-p="3">熔岩</button>
<label style="pointer-events:auto">风 <input id="wind" type="range" min="-1" max="1" step="0.01" value="0.15"></label><label style="pointer-events:auto">烟 <input id="smk" type="range" min="0" max="1" step="0.01" value="0.7"></label></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
const P=new URLSearchParams(location.search),DEMO=P.has("demo"),FT=P.has("t")?+P.get("t"):null;
const Q=(()=>{const coarse=matchMedia("(pointer:coarse)").matches,small=Math.min(innerWidth,innerHeight)<700,weak=(navigator.hardwareConcurrency||8)<=4,low=coarse||small||weak;return{low,pr:Math.min(devicePixelRatio||1,2),n:low?.5:1}})();
const fpsEl=document.createElement("div");fpsEl.id="fps";document.body.appendChild(fpsEl);
window.__fps=0;let __fc=0,__ft=performance.now(),__lc=0;
function perfTick(onLow){__fc++;const n=performance.now();if(n-__ft>=1000){window.__fps=Math.round(__fc*1000/(n-__ft));__fc=0;__ft=n;fpsEl.textContent=window.__fps+" FPS"+(Q.low?" · 省电档":"");if(window.__fps<40&&onLow&&++__lc>=2){__lc=0;onLow()}}}
import * as THREE from "three";
import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";
import {ShaderPass} from "three/addons/postprocessing/ShaderPass.js";
import {OutputPass} from "three/addons/postprocessing/OutputPass.js";
const R=new THREE.WebGLRenderer({antialias:!Q.low,powerPreference:"high-performance"});
R.setPixelRatio(Q.pr);R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);
const composer=new EffectComposer(R);composer.setPixelRatio(Q.pr);
function lowerPR(){if(Q.pr<=.6)return;Q.pr=Math.max(.6,Q.pr*.8);R.setPixelRatio(Q.pr);composer.setPixelRatio(Q.pr);composer.setSize(innerWidth,innerHeight)}
function onResize(cam){addEventListener("resize",()=>{if(cam.isPerspectiveCamera){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}R.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)})}
R.outputColorSpace=THREE.LinearSRGBColorSpace;const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);onResize(cam);
const src=[];for(let i=0;i<6;i++)src.push(new THREE.Vector3(0,0,0));
const U={uT:{value:0},uRes:{value:new THREE.Vector2()},uS:{value:src},uN:{value:0},uWind:{value:.15},uSmoke:{value:.7},uPal:{value:0}};
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}",
fragmentShader:`precision highp float;uniform float uT,uN,uWind,uSmoke,uPal;uniform vec2 uRes;uniform vec3 uS[6];varying vec2 vUv;
float h31(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float vn(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
vec3 pal(float t){t=clamp(t,0.,1.);
 if(uPal<.5)return mix(mix(vec3(0.),vec3(.9,.15,.02),smoothstep(0.,.35,t)),mix(vec3(1.,.55,.1),vec3(1.,.97,.8),smoothstep(.65,1.,t)),smoothstep(.3,.7,t));
 if(uPal<1.5)return mix(mix(vec3(0.),vec3(.05,.15,.9),smoothstep(0.,.35,t)),mix(vec3(.2,.6,1.),vec3(.9,1.,1.),smoothstep(.65,1.,t)),smoothstep(.3,.7,t));
 if(uPal<2.5)return mix(mix(vec3(0.),vec3(.35,.0,.6),smoothstep(0.,.35,t)),mix(vec3(.2,1.,.5),vec3(.9,1.,.9),smoothstep(.65,1.,t)),smoothstep(.3,.7,t));
 return mix(mix(vec3(0.),vec3(.6,.05,0.),smoothstep(0.,.4,t)),mix(vec3(1.,.35,0.),vec3(1.,.9,.3),smoothstep(.6,1.,t)),smoothstep(.3,.7,t));}
void main(){vec2 asp=vec2(uRes.x/uRes.y,1.);vec2 p=vUv*asp;float heat=0.,smoke=0.,ember=0.;
 for(int i=0;i<6;i++){if(float(i)>=uN)break;vec2 s=uS[i].xy*asp;float sz=uS[i].z;vec2 q=(p-s)/sz;
  if(q.y<-.3||q.y>4.5||abs(q.x)>2.5+q.y)continue;
  float t=uT+float(i)*7.3;q.x-=uWind*q.y*q.y*.12;
  vec3 w=vec3(q*vec2(2.2,1.4),t*.4);float n1=fbm(w+vec3(0.,-t*1.6,0.));float n2=fbm(vec3(q*3.1+n1*1.5,t*.7)-vec3(0.,t*2.4,0.));
  float shape=1.-length(vec2(q.x*(1.6+q.y*.4),max(q.y,0.)*.42+min(q.y,0.)*3.));
  float f=shape+n2*1.15-.55-q.y*.08;heat=max(heat,f*1.4);
  // 烟：在火焰上方，更大尺度、更慢
  vec2 sq=q-vec2(uWind*q.y*q.y*.08,1.6);float sn=fbm(vec3(sq*1.3-vec2(0.,t*.5),t*.15)+n1*.8);
  float sm=smoothstep(.3,1.6,q.y)*smoothstep(4.5,2.,q.y)*smoothstep(1.4+q.y*.5,.2,abs(sq.x))*smoothstep(.35,.75,sn);smoke=max(smoke,sm);
  // 火星
  for(int k=0;k<10;k++){float fk=float(k);float ph=fract(t*.45+fk*.173);vec2 ep=vec2(sin(fk*12.3+t*1.3)*.35*ph+uWind*ph*ph*2.,ph*3.5-.1);ember+=smoothstep(.05,0.,length(q-ep))*(1.-ph)*1.3;}
 }
 vec3 bg=mix(vec3(.02,.015,.03),vec3(.06,.04,.05),vUv.y);
 vec3 col=bg+pal(heat)*clamp(heat*1.6,0.,1.5);
 float glow=0.;for(int i=0;i<6;i++){if(float(i)>=uN)break;vec2 d=p-uS[i].xy*asp;glow+=.05*uS[i].z/(dot(d,d)+.02);}col+=pal(.55)*glow*.08;
 col=mix(col,vec3(.07,.065,.07)+col*.2,smoke*uSmoke*.8*(1.-clamp(heat,0.,1.)));col+=pal(.85)*ember;
 // 地面
 gl_FragColor=vec4(col,1.);}`});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
composer.addPass(new RenderPass(scene,cam));composer.addPass(new UnrealBloomPass(new THREE.Vector2(256,256),.6,.4,.75));composer.addPass(new OutputPass());
Q.pr=Math.min(Q.pr,Q.low?1:1.25);R.setPixelRatio(Q.pr);composer.setPixelRatio(Q.pr);
function add(x,y,s){if(U.uN.value>=6){src.shift();src.push(new THREE.Vector3())}const i=Math.min(5,U.uN.value);src[i].set(x,y,s);U.uN.value=Math.min(6,U.uN.value+1)}
add(.5,.12,.26);if(DEMO||FT!==null){add(.18,.16,.13);add(.82,.18,.15)}
let drag=-1,lastTap=0;
R.domElement.addEventListener("pointerdown",e=>{const x=e.clientX/innerWidth,y=1-e.clientY/innerHeight;const now=performance.now();if(now-lastTap<300){U.uN.value=0;lastTap=0;return}lastTap=now;
 let best=-1,bd=.06;for(let i=0;i<U.uN.value;i++){const d=Math.hypot(src[i].x-x,src[i].y-y);if(d<bd){bd=d;best=i}}if(best>=0)drag=best;else{add(x,y,.06+Math.random()*.08);drag=Math.min(5,U.uN.value-1)}});
addEventListener("pointermove",e=>{if(drag>=0)src[drag].set(e.clientX/innerWidth,1-e.clientY/innerHeight,src[drag].z)});addEventListener("pointerup",()=>drag=-1);
document.getElementById("wind").oninput=e=>U.uWind.value=+e.target.value;document.getElementById("smk").oninput=e=>U.uSmoke.value=+e.target.value;
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{U.uPal.value=+b.dataset.p;document.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("on",x==b))});
const clk=new THREE.Clock();
(function f(){requestAnimationFrame(f);perfTick(lowerPR);const dt=Math.min(.05,clk.getDelta());U.uT.value=FT!==null?FT:U.uT.value+dt;R.getDrawingBufferSize(U.uRes.value);
 if(DEMO&&FT===null)U.uWind.value=Math.sin(U.uT.value*.4)*.4;composer.render()})();
</script></body></html>
