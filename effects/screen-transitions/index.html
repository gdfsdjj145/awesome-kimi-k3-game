<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>场景转场效果 · 参考实现</title>
<style>*{margin:0;box-sizing:border-box}body{background:#111;overflow:hidden;font-family:system-ui,"PingFang SC",sans-serif;color:#fff}canvas{display:block}
#p{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#000b;padding:10px 12px;border-radius:14px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:94vw}
#p button{padding:6px 12px;border-radius:8px;border:1px solid #555;background:#1f1f2c;color:#fff;cursor:pointer;font-size:13px}#p button:hover{border-color:#fff}
#cap{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#000a;padding:6px 16px;border-radius:999px;font-size:14px}</style></head>
<body><canvas id="c"></canvas><div id="cap">点下方按钮切换场景（自动轮播中）</div><div id="p"></div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight;scenes.forEach(s=>s.cv=null)}
// 三个用 Canvas 程序绘制的场景
const scenes=[{name:"🌲 森林",draw:(g,w,h)=>{let gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"#9be0ff");gr.addColorStop(1,"#e8f7ff");g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let l=0;l<3;l++){g.fillStyle=["#7fb88f","#4f9a63","#2f7a45"][l];for(let i=-1;i<w/60+1;i++){const tx=i*60+(l*23)%60,th=h*(.35+l*.1)+Math.sin(i*3.1+l)*30;g.beginPath();g.moveTo(tx,h*.55+l*h*.12);g.lineTo(tx+40,h*.55+l*h*.12-th*.6);g.lineTo(tx+80,h*.55+l*h*.12);g.fill()}}g.fillStyle="#3a6b2a";g.fillRect(0,h*.8,w,h*.2)}},
 {name:"🏜️ 沙漠",draw:(g,w,h)=>{let gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"#ff9a4a");gr.addColorStop(.6,"#ffd27a");g.fillStyle=gr;g.fillRect(0,0,w,h);g.fillStyle="#fff3c0";g.beginPath();g.arc(w*.7,h*.3,60,0,7);g.fill();
  [["#e0a050",.6],["#c98238",.7],["#a8642a",.82]].forEach(([col,y],k)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,h);for(let i=0;i<=w;i+=10)g.lineTo(i,h*y+Math.sin(i*.006+k*2)*40);g.lineTo(w,h);g.fill()})}},
 {name:"🌌 星空城市",draw:(g,w,h)=>{let gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"#05051a");gr.addColorStop(1,"#3a1a5a");g.fillStyle=gr;g.fillRect(0,0,w,h);for(let i=0;i<300;i++){g.fillStyle=`rgba(255,255,255,${Math.random()})`;g.fillRect(Math.random()*w,Math.random()*h*.7,1.5,1.5)}
  for(let i=0;i<w;i+=45){const bh=h*(.15+((i*7919)%100)/250);g.fillStyle="#120a24";g.fillRect(i,h-bh,40,bh);g.fillStyle="#ffd86a";for(let y=h-bh+10;y<h-10;y+=16)for(let xx=i+6;xx<i+36;xx+=12)if((xx*y)%7<3)g.fillRect(xx,y,5,7)}}}];
function sc(i){const s=scenes[i];if(!s.cv){s.cv=document.createElement("canvas");s.cv.width=W;s.cv.height=H;s.draw(s.cv.getContext("2d"),W,H)}return s.cv}
rs();addEventListener("resize",rs);
let cur=0,next=null,prog=0,type=null,dur=60;const R=(a,b)=>a+Math.random()*(b-a);
// 每种转场：给定 A（旧）、B（新）和进度 p(0→1) 画一帧
const T={
 "淡入淡出":(A,B,p)=>{x.drawImage(A,0,0);x.globalAlpha=p;x.drawImage(B,0,0);x.globalAlpha=1},
 "黑场过渡":(A,B,p)=>{x.drawImage(p<.5?A:B,0,0);x.fillStyle=`rgba(0,0,0,${1-Math.abs(p-.5)*2})`;x.fillRect(0,0,W,H)},
 "圆形擦除":(A,B,p)=>{x.drawImage(A,0,0);x.save();x.beginPath();x.arc(W/2,H/2,Math.hypot(W,H)/2*ease(p),0,7);x.clip();x.drawImage(B,0,0);x.restore()},
 "百叶窗":(A,B,p)=>{x.drawImage(A,0,0);const n=12,bh=H/n;for(let i=0;i<n;i++){const q=Math.min(1,Math.max(0,p*1.6-i/n*.6));x.drawImage(B,0,i*bh,W,bh*q,0,i*bh,W,bh*q)}},
 "像素溶解":(A,B,p)=>{const s=Math.max(1,Math.round((1-Math.abs(p-.5)*2)*40));const src=p<.5?A:B;x.imageSmoothingEnabled=false;x.drawImage(src,0,0,W/s,H/s);x.drawImage(c,0,0,W/s,H/s,0,0,W,H);x.imageSmoothingEnabled=true},
 "推移滑动":(A,B,p)=>{const e=ease(p);x.drawImage(A,-W*e,0);x.drawImage(B,W*(1-e),0)},
 "菱形格":(A,B,p)=>{x.drawImage(A,0,0);x.save();x.beginPath();const s=70;for(let gy=0;gy<H/s+1;gy++)for(let gx=0;gx<W/s+1;gx++){const d=(gx+gy)/(W/s+H/s);const q=Math.min(1,Math.max(0,p*2-d))*s*.75;const cx=gx*s,cy=gy*s;x.moveTo(cx,cy-q);x.lineTo(cx+q,cy);x.lineTo(cx,cy+q);x.lineTo(cx-q,cy);x.closePath()}x.clip();x.drawImage(B,0,0);x.restore()},
 "漩涡碎片":(A,B,p)=>{x.drawImage(B,0,0);const n=10,m=6,tw=W/n,th=H/m;for(let i=0;i<n;i++)for(let j=0;j<m;j++){const d=((i*7+j*13)%17)/17,q=Math.max(0,p*1.5-d*.5);if(q>=1)continue;x.save();x.globalAlpha=1-q;x.translate(i*tw+tw/2,j*th+th/2+q*q*H*.8);x.rotate(q*(i%2?3:-3));x.scale(1-q*.5,1-q*.5);x.drawImage(A,i*tw,j*th,tw,th,-tw/2,-th/2,tw,th);x.restore()}},
 "故障闪切":(A,B,p)=>{x.drawImage(p<.5?A:B,0,0);const k=1-Math.abs(p-.5)*2;for(let i=0;i<12*k;i++){const y=R(0,H),h=R(4,40),src=Math.random()<.5?A:B;x.drawImage(src,0,y,W,h,R(-60,60)*k,y,W,h)}x.globalCompositeOperation="lighter";x.globalAlpha=.3*k;x.drawImage(c,6*k,0);x.globalAlpha=1;x.globalCompositeOperation="source-over"},
 "墨水晕染":(A,B,p)=>{x.drawImage(A,0,0);x.save();x.beginPath();for(let i=0;i<9;i++){const cx=W*((i*0.37)%1),cy=H*((i*0.61)%1),r=Math.hypot(W,H)*.45*ease(Math.min(1,p*1.3-i*.03));for(let k=0;k<=24;k++){const a=k/24*Math.PI*2,rr=Math.max(0,r*(1+.15*Math.sin(a*5+i)));k?x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr):x.moveTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath()}x.clip();x.drawImage(B,0,0);x.restore()}};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const pw=document.getElementById("p");Object.keys(T).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>go(k);pw.appendChild(b)});
let auto=!new URLSearchParams(location.search).get("still"),ai=0,lastUser=-1e9;
function go(k,isAuto){if(next!=null)return;if(!isAuto){lastUser=performance.now()}type=k;next=(cur+1)%scenes.length;prog=0;document.getElementById("cap").textContent=`转场：${k}  →  ${scenes[next].name}`}
function loop(now){x.setTransform(1,0,0,1,0,0);
 if(next!=null){prog+=1/dur;const p=Math.min(1,prog);T[type](sc(cur),sc(next),p);if(prog>=1){cur=next;next=null}}else{x.drawImage(sc(cur),0,0);x.fillStyle="#fff";x.font="bold 42px system-ui";x.textAlign="center";x.shadowColor="#000";x.shadowBlur=10;x.fillText(scenes[cur].name,W/2,H*.18);x.shadowBlur=0}
 if(auto&&next==null&&now-lastUser>4000&&Math.floor(now/2200)!=ai){ai=Math.floor(now/2200);go(Object.keys(T)[ai%Object.keys(T).length],true)}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
const q=new URLSearchParams(location.search).get("demo");if(q){auto=false;go("菱形格",true);dur=1e9;prog=.45}
</script></body></html>
