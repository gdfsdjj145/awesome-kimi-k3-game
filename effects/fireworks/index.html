<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>烟花 · 参考实现</title>
<style>*{margin:0}body{background:#000;overflow:hidden;font-family:system-ui,"PingFang SC",sans-serif;color:#fff}canvas{display:block}
#p{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#0009;padding:8px 14px;border-radius:999px;font-size:13px;display:flex;gap:10px;align-items:center;white-space:nowrap}
#p button{padding:4px 12px;border-radius:999px;border:1px solid #555;background:#1b1b2b;color:#fff;cursor:pointer}</style></head>
<body>
<style id="fxkit-css">#fxbar{position:fixed;right:6px;bottom:6px;z-index:9999;display:flex;gap:4px;align-items:center;font:11px system-ui,sans-serif;color:#bfe;background:#000a;padding:3px 6px;border-radius:8px;-webkit-user-select:none;user-select:none}#fxbar button{font:11px system-ui,sans-serif;padding:2px 6px;border-radius:6px;border:1px solid #fff5;background:#fff2;color:#fff;cursor:pointer}#fxbar button.off{opacity:.45;text-decoration:line-through}.fxglow{position:fixed;left:0;top:0;pointer-events:none;mix-blend-mode:screen;transform-origin:0 0}</style>
<script id="fxkit">/* 后期增强小工具：低分辨率辉光 + 关键时刻震屏 + 帧率自适应（第 5 轮追加） */
(()=>{const P=new URLSearchParams(location.search),get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v==="1"}catch(e){return d}},put=(k,v)=>{try{localStorage.setItem(k,v?"1":"0")}catch(e){}};
const low=matchMedia("(pointer:coarse)").matches||Math.min(innerWidth,innerHeight)<700||(navigator.hardwareConcurrency||8)<=4;
const FX=window.FX={low,glow:get("fx-glow",true)&&!P.has("noglow"),shakeOn:get("fx-shake",true)&&!P.has("noshake"),amp:0,fps:0,targets:[],shakeEl:null,onDegrade:null,div:low?5:4,
 shake(a){if(FX.shakeOn)FX.amp=Math.min(28,Math.max(FX.amp,a))},
 glowOf(cv,o={}){if(!cv)return;const g=document.createElement("canvas");const t={cv,g,gx:g.getContext("2d"),f:o.filter||"brightness(1.05) contrast(2.6) saturate(1.6)",op:o.op??.8,mode:o.mode||"inplace"};
  if(t.mode=="overlay"){g.className="fxglow";g.style.zIndex=o.z||2;document.body.appendChild(g)}else t.ctx=cv.getContext("2d");FX.targets.push(t)}};
const hasF=typeof document.createElement("canvas").getContext("2d").filter==="string";
function mkBar(){const b=document.createElement("div");b.id="fxbar";b.innerHTML='<span id="fxfps">-- FPS</span><button id="fxg">✨辉光</button><button id="fxs">📳震屏</button>';document.body.appendChild(b);
 const g=b.querySelector("#fxg"),s=b.querySelector("#fxs");const up=()=>{g.classList.toggle("off",!FX.glow);s.classList.toggle("off",!FX.shakeOn)};up();
 g.onclick=e=>{e.stopPropagation();FX.glow=!FX.glow;put("fx-glow",FX.glow);up()};s.onclick=e=>{e.stopPropagation();FX.shakeOn=!FX.shakeOn;put("fx-shake",FX.shakeOn);if(!FX.shakeOn)FX.amp=0;up()};
 ["pointerdown","touchstart","mousedown"].forEach(t=>b.addEventListener(t,e=>e.stopPropagation()));FX.bar=b;FX.fpsEl=b.querySelector("#fxfps")}
let fc=0,ft=performance.now(),lowN=0;
function tick(now){requestAnimationFrame(tick);fc++;if(now-ft>=1000){FX.fps=Math.round(fc*1000/(now-ft));window.__fps=FX.fps;fc=0;ft=now;if(FX.fpsEl)FX.fpsEl.textContent=FX.fps+" FPS"+(FX.low?" · 省电":"");
  if(FX.fps<40){if(++lowN>=2){lowN=0;if(FX.div<8)FX.div+=2;if(FX.onDegrade)FX.onDegrade()}}else lowN=0}
 const el=FX.shakeEl;if(el){if(FX.amp>.4&&FX.shakeOn){el.style.translate=`${((Math.random()-.5)*2*FX.amp).toFixed(1)}px ${((Math.random()-.5)*2*FX.amp).toFixed(1)}px`;FX.amp*=.86}else if(el.style.translate){FX.amp=0;el.style.translate=""}}
}
function post(){requestAnimationFrame(post);for(const t of FX.targets){if(t.mode=="overlay")t.g.style.display=FX.glow?"":"none";if(!FX.glow)continue;
  const cw=t.cv.width,ch=t.cv.height;if(!cw||!ch)continue;const w=Math.max(1,Math.round(cw/FX.div)),h=Math.max(1,Math.round(ch/FX.div));if(t.g.width!==w||t.g.height!==h){t.g.width=w;t.g.height=h}
  const x=t.gx;x.globalCompositeOperation="copy";if(hasF)x.filter=t.f;x.drawImage(t.cv,0,0,w,h);if(hasF)x.filter="none";
  if(!hasF){const d=x.getImageData(0,0,w,h),a=d.data;for(let i=0;i<a.length;i+=4){const l=(a[i]*.3+a[i+1]*.59+a[i+2]*.11)/255,k=Math.max(0,(l-.55)/.45)*1.6;a[i]*=k;a[i+1]*=k;a[i+2]*=k}x.putImageData(d,0,0)}
  if(t.mode=="overlay"){const r=t.cv.getBoundingClientRect(),st=t.g.style;st.transform=`translate(${r.left}px,${r.top}px)`;st.width=r.width+"px";st.height=r.height+"px";st.opacity=t.op}
  else{const c=t.ctx;c.save();c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation="lighter";c.globalAlpha=t.op;c.imageSmoothingEnabled=true;c.filter="none";c.drawImage(t.g,0,0,cw,ch);c.restore()}}}
/* 辉光在游戏自己的绘制之后执行：页面加载完再注册 */
addEventListener("load",()=>setTimeout(()=>requestAnimationFrame(post),50));
if(document.body)mkBar();else addEventListener("DOMContentLoaded",mkBar);requestAnimationFrame(tick)})();
</script>
<canvas id="c"></canvas><div id="p">点击夜空发射烟花 · <label><input type="checkbox" id="auto" checked> 自动燃放</label><button id="show">🎆 压轴连发</button><button id="txt">🔤 文字烟花</button></div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let W,H,G;function rs(){W=c.width=innerWidth;H=c.height=innerHeight;G=H*.86}rs();addEventListener("resize",rs);
let rockets=[],P=[],flash=0,t=0;const R=(a,b)=>a+Math.random()*(b-a);
const TYPES=["peony","willow","ring","heart","crossette","palm","strobe"];
const stars=Array.from({length:180},()=>({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.3,p:Math.random()*7}));
function launch(tx,ty,type,hue){rockets.push({x:tx+R(-30,30),y:G,tx,ty,vy:-Math.sqrt(2*.12*(G-ty)),vx:0,type:type||TYPES[Math.random()*TYPES.length|0],hue:hue??R(0,360),trail:[]});rockets.at(-1).vx=(tx-rockets.at(-1).x)/(-rockets.at(-1).vy/.12)}
function add(o){P.push(Object.assign({vx:0,vy:0,l:1,d:R(.008,.014),g:.04,drag:.985,r:2,trail:[]},o))}
function explode(r){const {x:X,y:Y,hue:h,type}=r;flash=.25;FX.shake(2.5);const col=()=>`hsl(${h+R(-15,15)},100%,${R(55,75)}%)`;
 if(type=="peony"){for(let i=0;i<160;i++){const a=R(0,7),v=R(1,6);add({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:col()})}}
 if(type=="willow"){for(let i=0;i<120;i++){const a=R(0,7),v=R(1,4.5);add({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:`hsl(45,100%,${R(55,70)}%)`,d:R(.004,.007),g:.03,drag:.975,tl:14})}}
 if(type=="ring"){const tilt=R(.3,1);for(let i=0;i<90;i++){const a=i/90*Math.PI*2;add({x:X,y:Y,vx:Math.cos(a)*5,vy:Math.sin(a)*5*tilt,c:col()})}for(let i=0;i<40;i++){const a=R(0,7);add({x:X,y:Y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,c:"#fff"})}}
 if(type=="heart"){for(let i=0;i<110;i++){const a=i/110*Math.PI*2,hx=16*Math.sin(a)**3,hy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));add({x:X,y:Y,vx:hx*.33,vy:hy*.33,c:`hsl(${340+R(-10,10)},100%,65%)`,g:.02})}}
 if(type=="crossette"){for(let i=0;i<24;i++){const a=R(0,7),v=R(3,5);add({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:col(),split:1,d:.02})}}
 if(type=="palm"){for(let i=0;i<8;i++){const a=i/8*Math.PI*2;for(let k=0;k<14;k++){const v=k*.35+1;add({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,c:`hsl(${30+R(-10,10)},100%,${50+k*2}%)`,d:.006,tl:10})}}}
 if(type=="strobe"){for(let i=0;i<130;i++){const a=R(0,7),v=R(1,5.5);add({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:"#fff",strobe:R(0,7),d:.007})}}}
function textShow(str){const o=document.createElement("canvas"),ox=o.getContext("2d");o.width=300;o.height=80;ox.fillStyle="#fff";ox.font="bold 60px system-ui,'PingFang SC'";ox.textAlign="center";ox.textBaseline="middle";ox.fillText(str,150,40);
 const d=ox.getImageData(0,0,300,80).data,X=W/2,Y=H*.32,s=Math.min(W/320,3);flash=.3;for(let y=0;y<80;y+=3)for(let xx=0;xx<300;xx+=3)if(d[(y*300+xx)*4+3]>128){const tx=(xx-150)*s,ty=(y-40)*s;add({x:X,y:Y,vx:tx/40,vy:ty/40,c:`hsl(${(xx*1.2)%360},100%,70%)`,g:0,drag:.96,d:.006})}}
addEventListener("pointerdown",e=>{if(e.target==c)launch(e.clientX,e.clientY)});
document.getElementById("show").onclick=()=>{for(let i=0;i<14;i++)setTimeout(()=>launch(R(W*.15,W*.85),R(H*.12,H*.45)),i*120)};
document.getElementById("txt").onclick=()=>textShow("新年快乐");
function loop(){t++;
 x.globalCompositeOperation="source-over";x.fillStyle="rgba(2,3,12,0.22)";x.fillRect(0,0,W,H);
 for(const s of stars){x.fillStyle=`rgba(255,255,255,${.3+.3*Math.sin(t*.03+s.p)})`;x.fillRect(s.x*W,s.y*H,s.r,s.r)}
 if(flash>0){x.fillStyle=`rgba(255,240,220,${flash*.25})`;x.fillRect(0,0,W,H);flash*=.85}
 x.fillStyle="#04050a";x.beginPath();x.moveTo(0,H);for(let i=0;i<=20;i++){const xx=i*W/20;x.lineTo(xx,G-20-((Math.sin(i*1.7)*.5+.5)*60)-(i%3==0?40:0))}x.lineTo(W,H);x.fill();
 x.globalCompositeOperation="lighter";
 if(document.getElementById("auto").checked&&t%45==0)launch(R(W*.15,W*.85),R(H*.12,H*.45));
 for(const r of rockets){r.trail.push([r.x,r.y]);if(r.trail.length>10)r.trail.shift();r.x+=r.vx;r.y+=r.vy;r.vy+=.12;
  for(let i=0;i<2;i++)add({x:r.x,y:r.y,vx:R(-.4,.4),vy:R(0,1),c:"#ffb060",d:.05,r:1.2,g:.02});
  x.strokeStyle="#ffd9a0";x.lineWidth=2;x.beginPath();r.trail.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.stroke();if(r.vy>=0){r.dead=1;explode(r)}}
 rockets=rockets.filter(r=>!r.dead);
 for(const p of P){p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx;p.y+=p.vy;p.l-=p.d;
  if(p.tl){p.trail.push([p.x,p.y]);if(p.trail.length>p.tl)p.trail.shift()}
  if(p.split&&p.l<.55){p.split=0;p.l=0;for(let k=0;k<4;k++){const a=k*Math.PI/2+R(-.2,.2);add({x:p.x,y:p.y,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5,c:p.c,d:.02})}}
  let a=Math.max(0,p.l);if(p.strobe!=null)a*=Math.sin(t*.6+p.strobe)>0?1:.1;if(p.l<.3)a*=Math.random()<.5?1:.3;
  x.globalAlpha=a;x.fillStyle=p.c;x.strokeStyle=p.c;
  if(p.tl&&p.trail.length>1){x.lineWidth=1.5;x.beginPath();p.trail.forEach(([u,v],i)=>i?x.lineTo(u,v):x.moveTo(u,v));x.stroke()}
  x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
 x.globalAlpha=1;P=P.filter(p=>p.l>0);
 // 水面倒影
 x.globalCompositeOperation="source-over";requestAnimationFrame(loop)}
loop();if(new URLSearchParams(location.search).get("demo")){document.getElementById("show").click();setTimeout(()=>textShow("新年快乐"),600)}
</script><script>/* 第 5 轮：挂载辉光与震屏 */FX.glowOf(document.getElementById("c"),{"op": 0.9, "mode": "overlay", "filter": "brightness(1.1) contrast(1.8) saturate(1.6)"});FX.shakeEl=document.getElementById("c");</script>
</body></html>
