<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>剪纸风格 · 参考实现</title>
<style>*{margin:0}body{overflow:hidden;background:#f6e7c8;font-family:system-ui,"PingFang SC",sans-serif}canvas{display:block}
#ui{position:fixed;top:12px;left:12px;background:#fff8ec;border:2px dashed #b3261e;border-radius:10px;padding:8px 12px;font-size:13px;color:#7a1a14;line-height:1.9}
#ui button{padding:3px 10px;border-radius:999px;border:1.5px solid #b3261e;background:#fff;color:#b3261e;cursor:pointer;margin:2px}#ui button.on{background:#b3261e;color:#fff}</style></head>
<body><canvas id="c"></canvas><div id="ui"><b>✂️ 剪纸风格</b> · 移动鼠标产生层间视差，点击放飞孔明灯<br>配色：<span id="th"></span></div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let W,H;const R=(a,b)=>a+Math.random()*(b-a);
const THEMES={红纸:{bg:"#f6e7c8",layers:["#f2b8a2","#e07a5f","#c8402f","#a8281f","#7a140f"]},靛蓝:{bg:"#e9eef5",layers:["#b9c9e6","#7f9ccf","#4d6fb0","#2f4b8a","#18284f"]},秋山:{bg:"#fbefd9",layers:["#f7d39a","#f0a856","#d9772e","#a24e1f","#5a2a12"]},夜樱:{bg:"#2a1d3a",layers:["#4a2f63","#6d3f86","#9d5aa8","#d58cc4","#ffd1e8"]}};let th="红纸";
const tw=document.getElementById("th");for(const k in THEMES){const b=document.createElement("button");b.textContent=k;b.onclick=()=>{th=k;[...tw.children].forEach(e=>e.classList.toggle("on",e==b));build()};if(k==th)b.classList.add("on");tw.appendChild(b)}
let layers=[],mx=0,my=0,cmx=0,cmy=0,lanterns=[],t=0;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;build()}
// 每层是一张离屏画布：剪影形状 + 镂空花纹（destination-out 挖洞）+ 纸张噪点
function paper(g,w,h,col){g.fillStyle=col;g.fill();g.save();g.globalCompositeOperation="source-atop";for(let i=0;i<w*h/400;i++){g.fillStyle=`rgba(255,255,255,${R(0,.05)})`;g.fillRect(R(0,w),R(0,h),R(1,3),R(1,3))}g.restore()}
function build(){const T=THEMES[th];layers=[];let s=11;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
 for(let li=0;li<5;li++){const cv=document.createElement("canvas");cv.width=W+120;cv.height=H+80;const g=cv.getContext("2d"),w=cv.width,h=cv.height;const base=h*(.42+li*.12);
  g.beginPath();g.moveTo(0,h);
  if(li<3){for(let xx=0;xx<=w;xx+=w/14){const pk=base-rnd()*h*(.16-li*.03);g.quadraticCurveTo(xx-w/28,pk-rnd()*40,xx,base-rnd()*30)}}
  else{for(let xx=0;xx<=w;xx+=8)g.lineTo(xx,base+Math.sin(xx*.01+li)*18+Math.sin(xx*.023)*10)}
  g.lineTo(w,h);g.closePath();paper(g,w,h,T.layers[li]);
  // 镂空：云纹 / 窗花 / 波浪
  g.globalCompositeOperation="destination-out";
  if(li==1)for(let i=0;i<6;i++){const cx=rnd()*w,cy=base+h*.05+rnd()*h*.1;for(let k=0;k<3;k++){g.beginPath();g.arc(cx+k*14,cy,7+k%2*3,Math.PI,0);g.lineWidth=3;g.strokeStyle="#000";g.stroke()}}
  if(li==3)for(let xx=20;xx<w;xx+=46){g.beginPath();g.arc(xx,base+40,10,0,7);g.fill();g.beginPath();for(let k=0;k<4;k++){const a=k*Math.PI/2;g.ellipse(xx+Math.cos(a)*18,base+40+Math.sin(a)*18,6,3,a,0,7)}g.fill()}
  if(li==4){for(let xx=0;xx<w;xx+=30){g.beginPath();g.arc(xx,base+60,12,Math.PI,0);g.lineWidth=2.5;g.stroke()}}
  g.globalCompositeOperation="source-over";
  // 装饰物：塔、房子、树、鹿
  g.fillStyle=T.layers[li];
  if(li==2){const px=w*.7,py=base-h*.08;for(let k=0;k<5;k++){const ww=60-k*9,yy=py-k*36;g.fillRect(px-ww/2+6,yy-24,ww-12,24);g.beginPath();g.moveTo(px-ww/2-8,yy-24);g.quadraticCurveTo(px,yy-40,px+ww/2+8,yy-24);g.fill()}g.fillRect(px-2,py-5*36-30,4,30);paper(g,w,h,T.layers[li])}
  if(li==3){for(const tx of[.15,.4,.85]){const X=w*tx,Y=base+Math.sin(X*.01+li)*18;g.beginPath();g.moveTo(X-4,Y);g.lineTo(X-3,Y-50);g.lineTo(X+3,Y-50);g.lineTo(X+4,Y);for(let k=0;k<4;k++){g.moveTo(X,Y-50-k*14);g.ellipse(X,Y-55-k*14,34-k*7,10,0,0,7)}g.fill()}
   const dx=w*.55,dy=base+Math.sin(w*.55*.01+li)*18;g.beginPath();g.ellipse(dx,dy-30,28,12,0,0,7);g.rect(dx-22,dy-24,4,24);g.rect(dx+18,dy-24,4,24);g.rect(dx-12,dy-24,4,24);g.rect(dx+8,dy-24,4,24);g.moveTo(dx+24,dy-36);g.lineTo(dx+36,dy-60);g.lineTo(dx+44,dy-58);g.lineTo(dx+30,dy-32);g.fill();
   g.strokeStyle=T.layers[li];g.lineWidth=2.5;g.beginPath();g.moveTo(dx+38,dy-60);g.lineTo(dx+34,dy-80);g.moveTo(dx+36,dy-72);g.lineTo(dx+28,dy-80);g.moveTo(dx+40,dy-60);g.lineTo(dx+50,dy-78);g.stroke()}
  layers.push({cv,depth:(li+1)/5})}}
rs();addEventListener("resize",rs);
addEventListener("pointermove",e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5});
addEventListener("pointerdown",e=>lanterns.push({x:e.clientX,y:e.clientY,vy:-R(.5,.9),ph:R(0,7),s:R(.7,1.2)}));
function loop(){t++;cmx+=(mx-cmx)*.06;cmy+=(my-cmy)*.06;const T=THEMES[th];x.fillStyle=T.bg;x.fillRect(0,0,W,H);
 // 太阳/月亮（剪纸圆 + 放射纹）
 x.save();x.translate(W*.72-cmx*10,H*.22-cmy*6);x.fillStyle=T.layers[2];x.shadowColor="rgba(0,0,0,.25)";x.shadowBlur=10;x.shadowOffsetY=4;x.beginPath();x.arc(0,0,56,0,7);x.fill();x.shadowBlur=0;x.shadowOffsetY=0;
 x.globalCompositeOperation="destination-out";x.restore();
 x.save();x.translate(W*.72-cmx*10,H*.22-cmy*6);x.fillStyle=T.bg;for(let k=0;k<12;k++){x.rotate(Math.PI/6);x.beginPath();x.ellipse(0,-36,4,10,0,0,7);x.fill()}x.beginPath();x.arc(0,0,18,0,7);x.fill();x.restore();
 layers.forEach((L,i)=>{const ox=-60-cmx*80*L.depth,oy=-40-cmy*30*L.depth+Math.sin(t*.01+i)*1.5;x.save();x.shadowColor="rgba(40,10,5,.35)";x.shadowBlur=14;x.shadowOffsetY=6;x.drawImage(L.cv,ox,oy);x.restore();
  if(i==2){for(const l of lanterns){l.y+=l.vy;l.ph+=.03;const lx=l.x+Math.sin(l.ph)*8;x.save();x.translate(lx,l.y);x.scale(l.s,l.s);x.shadowColor="rgba(0,0,0,.3)";x.shadowBlur=6;x.shadowOffsetY=3;x.fillStyle=T.layers[3];x.beginPath();x.moveTo(-12,-16);x.lineTo(12,-16);x.lineTo(15,12);x.lineTo(-15,12);x.fill();x.fillStyle=T.bg;x.fillRect(-4,-6,8,10);x.restore()}lanterns=lanterns.filter(l=>l.y>-40)}});
 // 纸张边框
 x.strokeStyle=T.layers[4];x.lineWidth=10;x.strokeRect(5,5,W-10,H-10);x.setLineDash([6,6]);x.lineWidth=1.5;x.strokeRect(18,18,W-36,H-36);x.setLineDash([]);
 requestAnimationFrame(loop)}
loop();if(new URLSearchParams(location.search).get("demo")){for(let i=0;i<5;i++)lanterns.push({x:W*(.2+i*.12),y:H*(.5+i%2*.1),vy:-.3,ph:i,s:1})}
</script></body></html>
